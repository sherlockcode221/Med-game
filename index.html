<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duel Game</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #121214; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1e1e24; border-radius: 12px; padding: 24px; max-width: 480px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-align: center; }
    .btn { background: #6366f1; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; margin: 8px 4px; transition: background 0.2s; }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
    .opt { background: transparent; color: #9ca3af; border: 1px solid #374151; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; margin: 8px 4px; }
    .opt:hover { border-color: #6b7280; color: #fff; }
    .big { font-size: 3rem; font-weight: 800; color: #6366f1; margin: 12px 0; }
    #er { color: #ef4444; margin-top: 12px; min-height: 1.5em; font-size: 0.9rem; }
    #hud { font-weight: bold; margin-bottom: 12px; }
    .lb-table { width: 100%; border-collapse: collapse; margin-top: 16px; text-align: left; }
    .lb-table th, .lb-table td { padding: 8px 12px; border-bottom: 1px solid #2d2d35; }
    .lb-table th { color: #9ca3af; font-size: 0.85rem; }
  </style>
</head>
<body>

<div id="hud" hidden></div>
<div id="g" class="card"></div>
<div id="er"></div>
<div id="lb-container" style="margin-top:24px;" class="card">
  <h3>Leaderboard</h3>
  <div id="lb">Loading leaderboard...</div>
</div>

<script>
// --- GLOBAL STATE & STUBS ---
var ROOM = null, RM = null, DB = null, USER = null, ME = "user_" + Math.random().toString(36).substring(2, 6);
var MODE = "solo", PH = "title", myReady = false, rnd = 0;
var score = 0, hearts = 3, streak = 0, si = 0, rows = [];

var g = document.getElementById("g");
var er = document.getElementById("er");
var OP = document.getElementById("hud");

function esc(str) {
  return String(str || "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function mk(seed) { return seed || 1; }
function hc(str) { var h = 0; for(var i=0; i<(str||"").length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0; return Math.abs(h); }
function getOpp() {
  if (!ROOM || !ROOM.peers) return null;
  var peers = ROOM.peers() || [];
  return peers.find(function(p) { return p.id !== ME; }) || null;
}
function oppName(o) { return (o && o.id) ? o.id.substring(0, 6) : "Opponent"; }
function hudUp() { if (OP) OP.textContent = "Score: " + score + " | Hearts: " + hearts; }
function intro() { g.innerHTML = '<h2>Match Started!</h2><p>Game in progress...</p><button class="btn" id="fin">Finish Game</button>'; document.getElementById("fin").onclick = duelEnd; }

function title() {
  PH = "title";
  if (ROOM && ROOM.leave) { ROOM.leave().catch(function(){}); ROOM = null; }
  OP.hidden = true;
  g.className = "card";
  g.innerHTML = '<h2>Main Menu</h2><p>Ready to play?</p>' +
    '<button class="btn" id="find">Find Match (Auto)</button>';
  document.getElementById("find").onclick = findAutoMatch;
}

function drawLB() {
  var container = document.getElementById("lb");
  if (!container) return;
  if (!rows || rows.length === 0) {
    container.innerHTML = "<p style='color:#9ca3af;'>No scores recorded yet.</p>";
    return;
  }
  var html = '<table class="lb-table"><thead><tr><th>Player</th><th>Best Score</th><th>Runs</th></tr></thead><tbody>';
  rows.forEach(function(r) {
    html += '<tr><td>' + esc(r.id.substring(0, 8)) + '</td><td>' + r.best + '</td><td>' + r.runs + '</td></tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}
function resolveNames() {}

// --- AUTOMATIC MATCHMAKING (NO CODES REQUIRED) ---
async function findAutoMatch() {
  er.textContent = "Searching for an opponent...";
  try {
    var r0 = await getRoom();
    if (!r0) throw new Error("Room service unavailable");

    // Join public queue room to locate waiting players
    var lobby = await r0.join("duel-public-queue");
    var peers = lobby.peers() || [];

    // Look for a peer waiting in queue
    var waitingPeer = peers.find(function(p) { 
      return p.id !== ME && p.presence && p.presence.matchRoom; 
    });

    var targetRoomCode;
    if (waitingPeer) {
      // Join existing waiting player's match room
      targetRoomCode = waitingPeer.presence.matchRoom;
    } else {
      // Generate match room and publish to queue presence
      targetRoomCode = "auto-" + Math.random().toString(36).substring(2, 8);
      lobby.presence({ matchRoom: targetRoomCode }).catch(function(){});
    }

    // Connect directly to the shared match room
    ROOM = await r0.join("duel-" + targetRoomCode);
    MODE = "duel";
    PH = "lobby";
    myReady = false;
    rnd = mk(hc(targetRoomCode));

    ROOM.presence({ ready: false, score: 0, hearts: 3, st: 0, done: false }).catch(function(){});
    ROOM.onPeers(onDuelPeers);
    drawLobby();
    er.textContent = "";

    // Leave queue room once matched
    lobby.leave().catch(function(){});
  } catch (e) {
    er.textContent = "Matchmaking failed: " + ((e && e.code) || e.message || "Try again.");
  }
}

function drawLobby() {
  var o = getOpp(), ready = o && o.presence && o.presence.ready;
  g.className = "card";
  g.innerHTML = '<h2>Duel Match</h2>' +
    '<p>' + (o ? '⚔️ <b>' + esc(oppName(o)) + '</b> joined!' + (ready ? ' (Ready)' : '') : '🔍 Finding opponent...') + '</p>' +
    '<button class="btn" id="rd"' + (o && !myReady ? '' : ' disabled') + '>' + (myReady ? 'Ready ✔ waiting...' : 'I\'m ready') + '</button> ' +
    '<button class="opt" id="bk">Leave</button>';

  document.getElementById("bk").onclick = title;
  document.getElementById("rd").onclick = function() {
    myReady = true;
    if (ROOM) ROOM.presence({ ready: true }).catch(function(){});
    drawLobby();
  };

  if (o && ready && myReady) {
    PH = "play"; hearts = 3; score = 0; streak = 0; si = 0;
    OP.hidden = false;
    updOpp();
    intro();
  }
}

function updOpp() {
  var o = getOpp();
  if (!o) { OP.textContent = "⚔️ Opponent left"; return; }
  var p = o.presence || {};
  OP.textContent = "⚔ " + oppName(o) + ": ⭐ " + (p.score || 0) + "  ❤ " + (p.hearts == null ? 3 : p.hearts) + "  stage " + ((p.st || 0) + 1) + (p.done ? " ✔" : "");
}

function onDuelPeers() {
  if (!ROOM) return;
  if (PH === "lobby") drawLobby();
  else if (PH === "play") updOpp();
  else if (PH === "end") { updOpp(); drawEnd(); }
}

function duelEnd() {
  PH = "end"; 
  hudUp();
  if (ROOM) ROOM.presence({ done: true, score: score, hearts: Math.max(hearts, 0) }).catch(function(){});
  drawEnd();
}

function drawEnd() {
  var o = getOpp(), p = o && o.presence, h = '<p class="big">' + score + '</p>';
  if (!o) h += '<h2>Opponent left 🏳️</h2><p>You win by forfeit.</p>';
  else if (!p || !p.done) h += '<h2>Finished!</h2><p>Waiting for ' + esc(oppName(o)) + ' to finish... (they have ' + ((p && p.score) || 0) + ')</p>';
  else {
    var t = p.score || 0;
    h += score > t ? '<h2>You win! 🏆</h2>' : score < t ? '<h2>You lost 💔</h2>' : '<h2>Draw 🤝</h2>';
    h += '<p>You ' + score + ' vs ' + esc(oppName(o)) + ' ' + t + '</p>';
  }
  g.innerHTML = h + '<button class="btn" id="go">Back to menu</button>';
  document.getElementById("go").onclick = title;
}

// Initial UI setup
title();

// --- SERVICES & REAL-TIME LEADERBOARD SUBSCRIPTION ---
async function getRoom() {
  if (RM) return RM;
  try { if (window.claude && claude.use) RM = await claude.use("room"); } catch (e) {}
  return RM;
}
getRoom();

(async function() {
  var c = window.claude;
  if (!c || !c.use) return;

  try {
    USER = await c.use("user");
    if (USER) ME = await USER.id();
  } catch (e) {}

  try {
    var db = await c.use("db");
    if (!db) return;
    DB = db;

    // Real-time snapshot listener
    db.collection("lb").orderBy("best", "desc").limit(100).onSnapshot(function(s) {
      rows = s.docs.map(function(d) {
        var data = d.data() || {};
        return { id: d.id, best: +(data.best || 0), runs: +(data.runs || 0) };
      });
      if (typeof resolveNames === "function") resolveNames();
      drawLB();
    }, function(err) {
      console.error("Leaderboard subscription error:", err);
    });
  } catch (e) {}
})();
</script>
</body>
