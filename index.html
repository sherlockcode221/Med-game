
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copy the Gene: Duel + Coins</title>
<style>
:root{--bg:#fff8ec;--ink:#1d2a4a;--card:#fff;--line:#1d2a4a;--yel:#ffc83d;--cor:#ff6b57;--mint:#5fd3a6;--sky:#8cc8ff;--mut:#5b6785;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a30;--ink:#fff4dc;--card:#1c2745;--line:#fff4dc;--mut:#a9b3d1}}
:root[data-theme="dark"]{--bg:#121a30;--ink:#fff4dc;--card:#1c2745;--line:#fff4dc;--mut:#a9b3d1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;line-height:1.45;font-size:16px}
main{max-width:520px;margin:0 auto;padding:14px 14px 50px}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px;gap:8px;flex-wrap:wrap;justify-content:center}
.hud span{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap;font-size:.9rem}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;box-shadow:6px 6px 0 var(--line)}
.hero{background:var(--yel);color:#1d2a4a}
h1{font-size:2.2rem;line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
h2{margin:0 0 6px;font-size:1.3rem}
p{margin:6px 0}
.bar{height:10px;background:rgba(128,128,128,.25);border-radius:9px;overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;background:var(--cor);transition:width .3s}
.btn{font:inherit;font-weight:800;color:#1d2a4a;background:var(--yel);border:3px solid var(--line);border-radius:14px;padding:11px 20px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
button:focus-visible{outline:3px solid var(--cor);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.opt.ok{background:var(--mint);color:#10301f}
.opt.no{background:var(--cor);color:#2a0a05}
.q{font-weight:800;font-size:1.15rem;margin:8px 0}
.fb{min-height:3em;font-weight:600;margin:8px 0}
.strand{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.b{width:38px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;border:2px solid var(--line);border-radius:10px;background:var(--sky);color:#10243f}
.b.r{background:var(--card);color:var(--ink);border-style:dashed}
.b.r.f{background:var(--mint);color:#10301f;border-style:solid}
.b.r.x{background:var(--cor);color:#2a0a05;border-style:solid}
.ends{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pad .btn{padding:14px 0;font-size:1.3rem}
.big{font-size:2.6rem;font-weight:800;margin:0}
.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i{transition:none}}
.tbar{height:12px;background:rgba(128,128,128,.25);border-radius:9px;overflow:hidden;border:2px solid var(--line)}
.tbar i{display:block;height:100%;width:100%;background:var(--mint)}
.tc{text-align:right;font-weight:800;font-size:.9rem;margin:2px 0 6px}
.lb{margin-top:18px}
.lb ol{list-style:none;margin:8px 0 0;padding:0}
.lb li{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:700}
.lb li.me{background:var(--yel);color:#1d2a4a}
.lb li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li small{font-weight:600;opacity:.7;margin-left:6px}
.lb input.w{width:100%;letter-spacing:0;text-transform:none;font-size:.85rem;margin:4px 0}
.lb small.c{opacity:.7}
.opp{background:var(--sky);color:#10243f;border:2px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:10px;font-weight:700;font-size:.9rem}
input{font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.2em;text-align:center;width:6.5em;padding:10px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-right:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.code{font-size:2.4rem;font-weight:800;letter-spacing:.25em;text-align:center;margin:10px 0}
textarea{font:inherit;width:100%;min-height:70px;padding:8px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<main>
<div class="hud" id="hud" hidden><span id="hh"></span><span id="ss"></span><span id="st"></span><span id="cc"></span></div>
<div class="opp" id="op" hidden></div>
<div class="card" id="g"></div>
</main>
<script>
var g=document.getElementById("g"),hud=document.getElementById("hud"),OP=document.getElementById("op");
var MODE="solo",ROOM=null,RM=null,PH="",CODE="",rnd=Math.random,myReady=false,onm={},maxH=3,shield=false,sh=false,runCoins=0,COINS=0,INV={heart:0,shield:0,fifty:0};

try{
  COINS=+localStorage.getItem("ctg_coins")||0;
  INV=Object.assign(INV,JSON.parse(localStorage.getItem("ctg_inv")||"{}"));
}catch(e){}

function saveInv(){
  try{
    localStorage.setItem("ctg_inv",JSON.stringify(INV));
    localStorage.setItem("ctg_coins",COINS);
  }catch(e){}
}

function addCoins(n){
  COINS+=n;
  runCoins+=n;
  saveInv();
  hudUp();
}

function startRun(){
  hearts=3;maxH=3;shield=false;sh=false;runCoins=0;score=0;streak=0;si=0;
  if(MODE==="solo"){
    if(INV.heart>0){INV.heart--;hearts=4;maxH=4}
    if(INV.shield>0){INV.shield--;shield=true}
    saveInv();
  }
}

var hearts,score,streak,si,qi,locked,seq,pos,pb=0,tmr=null,tl=0,tt=1,DB=null,USER=null,ME=null,rows=[],names={};
try{pb=+localStorage.getItem("ctg_pb")||0}catch(e){}

var COMP={A:"U",T:"A",G:"C",C:"G"};
var S=[
{n:"Stage 1: The Photocopier",d:"Copy the DNA template into mRNA. Tap the matching RNA base for each letter (A→U, T→A, G→C, C→G). RNA has no T!",t:"build",rounds:3},
{n:"Stage 2: Who Makes What?",d:"Three polymerases, three jobs. Pick the right one.",t:"mc",q:[
["Makes mRNA in eukaryotes",["Pol I","Pol II","Pol III"],1,"Pol II = mRNA, and it recognizes promoters."],
["Makes tRNA",["Pol III","Pol II","Pol I"],0,"Pol III = tRNA + 5S rRNA + small RNAs."],
["Makes the 28S, 18S and 5.8S rRNAs",["Pol III","Pol I","Pol II"],1,"Pol I = large rRNAs."],
["Makes 5S rRNA",["Pol I","Pol II","Pol III"],2,"5S rRNA is the odd one out: Pol III."]]},
{n:"Stage 3: Bacteria Blitz",d:"Prokaryote transcription. Quick, who does the job?",t:"mc",q:[
["Finds the promoter",["β′","σ (sigma)","ω"],1,"Sigma = the GPS."],
["Catalytic subunit that builds RNA 5′→3′",["β","α","σ"],0,"β is the builder."],
["Grips the DNA template",["β′","α","ρ"],0,"β′ binds the DNA template."],
["The −10 box sequence is called...",["Hogness box","Pribnow box","CAAT box"],1,"Pribnow (TATAAT). Hogness is the eukaryotic TATA box."],
["Needs a GC-rich hairpin to stop transcription",["ρ-dependent","Intrinsic (ρ-independent)","Rifampin"],1,"Palindrome DNA → hairpin RNA → polymerase stalls."],
["Uses ATP to pull RNA and polymerase off DNA",["Rho factor","Sigma factor","TFIID"],0,"Rho = the referee."]]},
{n:"Stage 4: Eukaryote Maze",d:"Initiation in eukaryotes and the RNA makeover.",t:"mc",q:[
["First factor to bind the TATA box",["TFIIH","TFIID","TFIIB"],1,"TFIID lands first, then the PIC assembles."],
["The helicase that unwinds DNA in the PIC",["TFIIH","TFIID","Rho"],0,"TFIIH = helicase."],
["7-methylguanosine cap belongs to...",["tRNA","mRNA","rRNA"],1,"The 5′ cap + poly-A tail = mRNA."],
["CCA is added to the 3′ end of...",["mRNA","rRNA","tRNA"],2,"CCA addition = tRNA makeover."],
["45S precursor is cut into 18S, 5.8S, 28S",["rRNA","mRNA","tRNA"],0,"45S → rRNAs, then ribosome assembly."],
["Alternative splicing gives you...",["More introns","Many proteins from one gene","A longer poly-A tail"],1,"Different exon combos = protein diversity."]]},
{n:"Boss: Dr. Inhibitor",d:"The boss attacks with antibiotics. Answer fast, no mistakes!",t:"mc",q:[
["Treats TB by binding β of bacterial RNAP",["Rifampin","Actinomycin D","Penicillin"],0,"Rifampin blocks incoming nucleotides at initiation."],
["Binds tightly to the DNA template and blocks polymerase movement",["Rifampin","Actinomycin D","Rifampin + σ"],1,"Actinomycin D stops elongation."],
["Which one also works in eukaryotes?",["Rifampin","Actinomycin D","Neither"],1,"Actinomycin D hits both, Rifampin is bacterial only."],
["Enhancers bind...",["Activator proteins (TFs, steroid hormones)","Rho factor","Spliceosomes"],0,"Enhancers can sit upstream OR downstream and boost transcription."]]}
];
S[1].sec=10;S[2].sec=9;S[3].sec=9;S[4].sec=6;

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function stopT(){clearInterval(tmr);tmr=null}
function startT(sec,end){
  stopT();tt=sec;tl=sec;
  tmr=setInterval(function(){
    tl-=.1;
    var b=document.getElementById("tb"),c=document.getElementById("tc");
    if(b){b.style.width=Math.max(0,tl/tt*100)+"%";b.style.background=tl/tt<.3?"var(--cor)":"var(--mint)"}
    if(c)c.textContent="⏱ "+Math.max(0,Math.ceil(tl))+"s";
    if(tl<=0){stopT();end()}
  },100);
}
function tbar(){return '<div class="tbar"><i id="tb"></i></div><div class="tc" id="tc"></div>'}

function hudUp(){
  hud.hidden=false;
  if(MODE==="duel"&&ROOM&&PH==="play")ROOM.presence({score:score,hearts:Math.max(hearts,0),st:si}).catch(function(){});
  document.getElementById("hh").textContent="❤️".repeat(Math.max(hearts,0))+"🖤".repeat(Math.max(maxH-Math.max(hearts,0),0))+(shield?"🛡":"");
  document.getElementById("ss").textContent="⭐ "+score;
  document.getElementById("st").textContent="🔥 "+streak;
  document.getElementById("cc").textContent="🪙 "+COINS;
}

function resolveNames(){if(USER&&rows.length){USER.profiles(rows.map(function(r){return r.id})).then(function(p){names=p||{};drawLB()}).catch(drawLB)}else drawLB()}
var NICK="",LB=[],last=null;
try{NICK=localStorage.getItem("ctg_nick")||"";LB=JSON.parse(localStorage.getItem("ctg_lb")||"[]")}catch(e){}
function saveLB(){try{localStorage.setItem("ctg_lb",JSON.stringify(LB))}catch(e){}}
function addEntry(n,sc,c){n=String(n).replace(/[|\n]/g,"").slice(0,12)||"Player";var f=LB.filter(function(e){return e.n===n&&e.c===c})[0];if(f){if(sc>f.s)f.s=sc}else LB.push({n:n,s:sc,c:c});saveLB()}
function saveNick(){var v=document.getElementById("nk");if(v){NICK=v.value.replace(/[|\n]/g,"").trim().slice(0,12);try{localStorage.setItem("ctg_nick",NICK)}catch(e){}}}

function finish(){
  stopT();
  if(score>pb){pb=score;try{localStorage.setItem("ctg_pb",pb)}catch(e){}}
  var c=MODE==="challenge"?CODE:"-";
  addEntry(NICK||"Player",score,c);
  last={n:(NICK||"Player"),s:score,c:c};
}

function drawLB(){
  var el=document.getElementById("lb");if(!el)return;
  var h='<p><b>Your best: '+pb+'</b></p>';
  if(last){h+='<p>Your score code. Send it to friends:</p><input class="w" id="sc" readonly value="CTG|'+esc(last.n)+'|'+last.s+'|'+last.c+'"><button class="btn" id="cp">Copy</button>'}
  h+='<h2>🏆 Leaderboard</h2>';
  var L=LB.slice().sort(function(a,b){return b.s-a.s}).slice(0,20);
  if(!L.length)h+='<p>No scores yet. Play a run, or add your friends\' codes below.</p>';
  else{h+='<ol>';L.forEach(function(r,i){var m=["🥇","🥈","🥉"][i]||(i+1)+".";h+='<li class="'+(r.n===NICK?"me":"")+'"><span>'+m+" "+esc(r.n)+(r.c!=="-"?' <small class="c">#'+esc(r.c)+'</small>':'')+'</span><span>'+r.s+'</span></li>'});h+='</ol>'}
  h+='<p>'+(last&&last.c!=='-'?'<b>Duel result:</b> paste your opponent\'s score code to see who won.':'Add friends\' score codes (paste one or many):')+'</p><textarea id="im" aria-label="Score codes"></textarea><button class="btn" id="ad">Add to board</button><div class="fb" id="ie" aria-live="polite"></div>';
  el.innerHTML=h;
  var cp=document.getElementById("cp");if(cp)cp.onclick=function(){var i=document.getElementById("sc");i.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(i.value).catch(function(){});cp.textContent="Copied ✔"};
  document.getElementById("ad").onclick=function(){
    var t=document.getElementById("im").value,vs=null,re=/CTG\|([^|\n]{1,12})\|(\d{1,5})\|([A-Za-z0-9-]{1,4})/g,m,n=0;
    while((m=re.exec(t))){addEntry(m[1],+m[2],m[3].toUpperCase());n++;if(last&&last.c!=="-"&&m[3].toUpperCase()===last.c&&(!vs||+m[2]>vs.s))vs={n:m[1],s:+m[2]}}
    var msg=n?"Added "+n+" score"+(n>1?"s":"")+".":"No valid codes found.";
    if(vs){var d=last.s-vs.s;msg="⚔️ You "+last.s+" vs "+vs.n+" "+vs.s+": "+(d>0?"you win by "+d+"! 🏆":d<0?"you lost by "+(-d)+" 💔":"it's a draw 🤝")}
    document.getElementById("ie").textContent=msg;if(n)setTimeout(drawLB,700);
  };
}

function title(){
  stopT();hud.hidden=true;OP.hidden=true;PH="";MODE="solo";CODE="";rnd=Math.random;g.className="card hero";
  g.innerHTML='<h1>Copy the Gene ⏱</h1><p>Every answer is on the clock. Faster = more points. 5 stages, 3 hearts. Time out = lose a heart.</p><p>🪙 <b>'+COINS+'</b> coins</p><p><b>Your nickname:</b></p><input class="w nk" id="nk" maxlength="12" placeholder="Nickname" value="'+esc(NICK)+'" style="width:100%;text-transform:none;letter-spacing:0;text-align:left;margin-bottom:6px"><div class="row"><button class="btn" id="go">Solo race</button><button class="btn" id="dl">⚔️ 1v1 duel</button><button class="btn" id="shp">🛒 Shop</button></div><div class="lb" id="lb"></div>';
  document.getElementById("go").onclick=function(){saveNick();startRun();intro()};
  document.getElementById("shp").onclick=function(){shopMenu()};
  document.getElementById("dl").onclick=function(){saveNick();chMenu()};
  drawLB();
}

function chMenu(){
  stopT();hud.hidden=true;g.className="card";
  g.innerHTML='<h2>1v1 Duel ⚔️</h2><p>Create a code or join live rooms. Same questions, same clock!</p><div class="row"><button class="btn" id="asyn">Code duel (async)</button><button class="btn" id="live">Live 1v1 room</button></div><button class="opt" id="bk">Back</button>';
  document.getElementById("bk").onclick=title;
  document.getElementById("asyn").onclick=asyncDuelMenu;
  document.getElementById("live").onclick=duelMenu;
}

function asyncDuelMenu(){
  stopT();hud.hidden=true;g.className="card";
  g.innerHTML='<h2>Code Duel ⚔️</h2><p>Create a code and send it to your friend. You both get the <b>exact same questions</b>. Play, then swap score codes to see who won.</p><div class="row"><input id="cd" maxlength="4" placeholder="CODE" aria-label="Challenge code"><button class="btn" id="nw">New code</button></div><div class="fb" id="er" aria-live="polite"></div><button class="btn" id="st">Start</button> <button class="opt" id="bk">Back</button>';
  document.getElementById("bk").onclick=chMenu;
  document.getElementById("nw").onclick=function(){var a="ABCDEFGHJKMNPQRSTUVWXYZ23456789",c="";for(var i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];document.getElementById("cd").value=c;document.getElementById("er").textContent="Share this code with your friends: "+c};
  document.getElementById("st").onclick=function(){
    var c=document.getElementById("cd").value.trim().toUpperCase();
    if(!/^[A-Z0-9]{4}$/.test(c)){document.getElementById("er").textContent="Enter or create a 4-character code.";return}
    MODE="challenge";CODE=c;rnd=mk(hc(c));startRun();OP.hidden=false;OP.textContent="⚔️ Duel code: "+c;intro();
  };
}

function shopMenu(m){
  stopT();hud.hidden=true;OP.hidden=true;g.className="card";
  var it=[["heart","❤️ Extra heart","Start your next solo run with 4 hearts",25],["shield","🛡 Shield","Blocks your first mistake in a solo run",20],["fifty","✂️ Remove a wrong answer","Use it during a question",10]];
  var h='<h2>Shop 🛒</h2><p>🪙 <b>'+COINS+'</b> coins. Earn them by answering right. Power-ups work in solo runs only, so duels stay fair.</p>';
  it.forEach(function(x){h+='<div class="opt" style="cursor:default"><b>'+x[1]+'</b> <small>(owned: '+INV[x[0]]+')</small><br>'+x[2]+'<br><button class="btn buy" data-k="'+x[0]+'" data-p="'+x[3]+'" style="margin-top:6px;padding:6px 14px">Buy for 🪙 '+x[3]+'</button></div>'});
  g.innerHTML=h+'<div class="fb" aria-live="polite">'+(m||"")+'</div><button class="opt" id="bk">Back</button>';
  document.getElementById("bk").onclick=title;
  g.querySelectorAll(".buy").forEach(function(b){
    b.onclick=function(){
      var p=+b.dataset.p,k=b.dataset.k;
      if(COINS<p){shopMenu("Not enough coins yet. Keep playing!");return}
      COINS-=p;INV[k]++;saveInv();shopMenu("Bought! ✔");
    };
  });
}

function intro(){
  hudUp();var s=S[si];g.className="card";
  g.innerHTML='<h2>'+s.n+'</h2><p>'+s.d+'</p><p><b>'+(s.t==="build"?"Time depends on the strand length.":s.sec+" seconds per question.")+'</b></p><button class="btn" id="go">Go</button>';
  document.getElementById("go").onclick=function(){qi=0;if(s.t==="build")newRound();else{s.o=shuf(s.q.slice());showQ()}};
}

function ok(){var p=10+Math.min(streak,5)*2+Math.round(Math.max(tl,0)/tt*8);streak++;score+=p;return p}
function bad(){streak=0;if(shield){shield=false;sh=true;hudUp();return false}hearts--;hudUp();if(hearts<=0){setTimeout(over,1200);return true}return false}
function bar(n,t){return '<div class="bar"><i style="width:'+(n/t*100)+'%"></i></div>'}

function addFifty(q){
  if(MODE!=="solo"||INV.fifty<1)return;
  var b=document.createElement("button");b.className="opt";b.textContent="✂️ Remove a wrong answer (x"+INV.fifty+")";
  b.onclick=function(){
    if(locked)return;
    var w=[].slice.call(g.querySelectorAll(".opt[data-k]")).filter(function(x){return +x.dataset.k!==q[2]&&!x.disabled});
    if(!w.length)return;
    var x=w[Math.floor(Math.random()*w.length)];x.disabled=true;x.style.opacity=.3;
    INV.fifty--;saveInv();b.remove();
  };
  g.appendChild(b);
}

function showQ(){
  var s=S[si],q=s.o[qi];locked=false;hudUp();
  var h=bar(qi,s.o.length)+tbar()+'<div class="q">'+q[0]+'</div>';
  shuf([0,1,2]).forEach(function(k){h+='<button class="opt" data-k="'+k+'">'+q[1][k]+'</button>'});
  g.innerHTML=h+'<div class="fb" aria-live="polite"></div>';
  g.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.k,b)}});
  addFifty(q);startT(s.sec,function(){pick(-1)});
}

function pick(k,b){
  if(locked)return;locked=true;stopT();var s=S[si],q=s.o[qi],fb=g.querySelector(".fb"),dead=false;
  g.querySelectorAll(".opt").forEach(function(x){if(+x.dataset.k===q[2])x.classList.add("ok")});
  if(k===q[2]){
    var p=ok();var cn=1+(streak>=3?1:0);addCoins(cn);
    fb.textContent="✅ +"+p+" and 🪙 +"+cn+". "+q[3];
  }else{
    if(b)b.classList.add("no");
    fb.textContent=(k<0?"⏰ Time's up! ":"❌ ")+q[3];
    dead=bad();
    if(sh){fb.textContent+=" 🛡 Shield saved your heart!";sh=false}
  }
  hudUp();if(dead)return;
  setTimeout(function(){qi++;if(qi>=s.o.length)stageDone();else showQ()},1500);
}

function newRound(){
  var L=5+qi,a="ACGT";seq=[];for(var i=0;i<L;i++)seq.push(a[Math.floor(rnd()*4)]);pos=0;locked=false;drawBuild();
  startT(4+L*1.6,function(){buildTimeout()});
}

function drawBuild(msg){
  var s=S[si],h=bar(qi,s.rounds)+tbar()+'<div class="q">Round '+(qi+1)+': build the mRNA</div><div class="ends"><span>DNA template 3′</span><span>5′</span></div><div class="strand">';
  seq.forEach(function(c){h+='<div class="b">'+(c==="U"?"T":c)+'</div>'});
  h+='</div><div class="ends"><span>mRNA 5′</span><span>3′</span></div><div class="strand" id="rs">';
  seq.forEach(function(c,i){h+='<div class="b r'+(i<pos?" f":"")+'">'+(i<pos?COMP[c]:"")+'</div>'});
  h+='</div><div class="fb" aria-live="polite">'+(msg||"Tap the base that pairs with the next DNA letter.")+'</div><div class="pad">';
  ["A","U","G","C"].forEach(function(c){h+='<button class="btn" data-c="'+c+'">'+c+'</button>'});
  g.innerHTML=h+'</div>';
  g.querySelectorAll(".pad .btn").forEach(function(b){b.onclick=function(){tap(b.dataset.c)}});
}

function nextRound(){qi++;if(qi>=S[si].rounds)stageDone();else newRound()}
function buildTimeout(){if(locked)return;locked=true;var dead=bad();drawBuild("⏰ Time's up! Too slow.");if(!dead)setTimeout(nextRound,1200)}

function tap(c){
  if(locked)return;
  if(c===COMP[seq[pos]]){
    ok();pos++;hudUp();
    if(pos>=seq.length){
      locked=true;stopT();score+=Math.round(tl*2);addCoins(3);
      drawBuild("🎉 Copy complete! Speed bonus +"+Math.round(tl*2));
      setTimeout(nextRound,1200);
    }else drawBuild("Nice! Keep going.");
  }else{
    var dead=bad();drawBuild("❌ "+seq[pos]+" pairs with "+COMP[seq[pos]]+" (A→U, T→A, G→C, C→G).");
    var cells=document.querySelectorAll("#rs .b");if(cells[pos])cells[pos].classList.add("x");
    if(dead){locked=true;stopT()}
  }
}

function stageDone(){
  stopT();si++;addCoins(5);
  if(si>=S.length)return win();
  g.innerHTML='<h2>Stage clear! ✨</h2><p>Score: '+score+'. Hearts left: '+hearts+'.</p><button class="btn" id="go">Next stage</button>';
  document.getElementById("go").onclick=intro;
}

function win(){
  var bonus=hearts*20;score+=bonus;addCoins(15);if(MODE==="duel")return duelEnd();var nb=score>pb;finish();
  var r=hearts===3?"Transcription Legend 🏆":hearts===2?"RNAP Pro 🥇":"Survivor 🥈";
  g.innerHTML='<p class="big">'+score+'</p><h2>'+r+'</h2><p>Boss defeated! Bonus +'+bonus+' for hearts left. 🪙 +'+runCoins+' coins this run.'+(nb?' <b>New personal best! 🎉</b>':'')+'</p><button class="btn" id="go">Race again</button><div class="lb" id="lb"></div>';
  document.getElementById("go").onclick=title;drawLB();
}

function over(){
  stopT();if(MODE==="duel")return duelEnd();var nb=score>pb;finish();
  g.innerHTML='<h2>Game over 💔</h2><p>You fell off the DNA at stage '+(si+1)+'. Score: '+score+(nb?'. <b>New personal best!</b>':'.')+' 🪙 +'+runCoins+' coins.</p><button class="btn" id="go">Try again</button><div class="lb" id="lb"></div>';
  document.getElementById("go").onclick=title;drawLB();
}

function mk(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hc(x){var h=7;for(var i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))|0;return h}
function getOpp(){if(!ROOM)return null;var o=ROOM.peers().filter(function(p){return !p.isMe&&p.kind==="viewer"});return o[0]||null}
function oppName(p){var k=p&&p.by;if(k&&onm[k])return onm[k];if(k&&USER)USER.profiles([k]).then(function(r){onm[k]=(r&&r[k]&&r[k].name)||"Opponent";onDuelPeers()}).catch(function(){});return "Opponent"}

function duelMenu(){
  stopT();hud.hidden=true;OP.hidden=true;g.className="card";
  g.innerHTML='<h2>Live 1v1 Room ⚔️</h2><p>Same questions, same clock. Higher score wins.</p><button class="btn" id="mk">Create duel</button><p>Or join a friend with their code:</p><div><input id="cd" maxlength="4" placeholder="CODE" aria-label="Duel code"><button class="btn" id="jn">Join</button></div><div class="fb" id="er" aria-live="polite"></div><button class="opt" id="bk">Back</button>';
  document.getElementById("bk").onclick=chMenu;
  document.getElementById("mk").onclick=function(){var a="ABCDEFGHJKMNPQRSTUVWXYZ23456789",c="";for(var i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];joinDuel(c)};
  document.getElementById("jn").onclick=function(){var c=document.getElementById("cd").value.trim().toUpperCase();if(c.length!==4){document.getElementById("er").textContent="Enter the 4-character code.";return}joinDuel(c)};
}

async function joinDuel(c){
  var er=document.getElementById("er");er.textContent="Joining...";
  var r0=await getRoom();
  if(!r0){er.textContent="Live duels need active room support. You can use Code Duels (async) anytime!";return}
  try{
    var r=await r0.join("duel-"+c.toLowerCase());
    ROOM=r;CODE=c;MODE="duel";PH="lobby";myReady=false;rnd=mk(hc(c));
    r.presence({ready:false,score:0,hearts:3,st:0,done:false}).catch(function(){});r.onPeers(onDuelPeers);drawLobby();
  }catch(e){er.textContent="Couldn't join ("+((e&&e.code)||"error")+"). Try again in a moment."}
}

function drawLobby(){
  var o=getOpp(),ready=o&&o.presence.ready;
  g.className="card";
  g.innerHTML='<h2>Duel lobby</h2><p>Share this code with your opponent:</p><div class="code">'+esc(CODE)+'</div><p>'+(o?'⚔️ <b>'+esc(oppName(o))+'</b> is here'+(ready?' and ready!':'.'):'Waiting for an opponent...')+'</p>'+
  '<button class="btn" id="rd"'+(o&&!myReady?'':' disabled')+'>'+(myReady?'Ready ✔ waiting...':'I\'m ready')+'</button> <button class="opt" id="bk">Leave</button>';
  document.getElementById("bk").onclick=title;
  document.getElementById("rd").onclick=function(){myReady=true;ROOM.presence({ready:true}).catch(function(){});drawLobby()};
  if(o&&ready&&myReady){PH="play";startRun();OP.hidden=false;updOpp();intro()}
}

function updOpp(){var o=getOpp();if(!o){OP.textContent="⚔️ Opponent left";return}var p=o.presence;OP.textContent="⚔️ "+oppName(o)+": ⭐ "+(p.score||0)+"  ❤️ "+(p.hearts==null?3:p.hearts)+"  stage "+((p.st||0)+1)+(p.done?" ✔":"")}
function onDuelPeers(){if(!ROOM)return;if(PH==="lobby")drawLobby();else if(PH==="play")updOpp();else if(PH==="end"){updOpp();drawEnd()}}
function duelEnd(){PH="end";hudUp();ROOM.presence({done:true,score:score,hearts:Math.max(hearts,0)}).catch(function(){});drawEnd()}

function drawEnd(){
  var o=getOpp(),p=o&&o.presence,h='<p class="big">'+score+'</p>';
  if(!o)h+='<h2>Opponent left 🏳️</h2><p>You win by forfeit.</p>';
  else if(!p.done)h+='<h2>Finished!</h2><p>Waiting for '+esc(oppName(o))+' to finish... (they have '+(p.score||0)+')</p>';
  else{var t=p.score||0;h+=score>t?'<h2>You win! 🏆</h2>':score<t?'<h2>You lost 💔</h2>':'<h2>Draw 🤝</h2>';h+='<p>You '+score+' vs '+esc(oppName(o))+' '+t+'</p>'}
  g.innerHTML=h+'<button class="btn" id="go">Back to menu</button>';
  document.getElementById("go").onclick=title;
}

title();

async function getRoom(){if(RM)return RM;try{if(window.claude&&claude.use)RM=await claude.use("room")}catch(e){}return RM}
getRoom();
(async function(){
  var c=window.claude;if(!c||!c.use)return;
  try{USER=await c.use("user");if(USER){ME=await USER.id()}}catch(e){}
  try{
    var db=await c.use("db");if(!db)return;DB=db;
    db.collection("lb").orderBy("best","desc").limit(100).onSnapshot(function(s){rows=s.docs.map(function(d){return{id:d.id,best:+d.data().best||0,runs:+d.data().runs||1}});resolveNames()},function(){});
    drawLB();
  }catch(e){}
})();
</script>
</body>
</html>
