<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copy the Gene: Race, Shop & Duel</title>
<!-- Firebase SDKs for Global Leaderboard & Duels -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#fff8ec;--ink:#1d2a4a;--card:#fff;--line:#1d2a4a;--yel:#ffc83d;--cor:#ff6b57;--mint:#5fd3a6;--sky:#8cc8ff;--mut:#5b6785;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a30;--ink:#fff4dc;--card:#1c2745;--line:#fff4dc;--mut:#a9b3d1}}
:root[data-theme="dark"]{--bg:#121a30;--ink:#fff4dc;--card:#1c2745;--line:#fff4dc;--mut:#a9b3d1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;line-height:1.45;font-size:16px}
main{max-width:520px;margin:0 auto;padding:14px 14px 50px}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px;gap:6px;flex-wrap:wrap}
.hud span{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;font-size:.9rem}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;box-shadow:6px 6px 0 var(--line)}
.hero{background:var(--yel);color:#1d2a4a}
h1{font-size:2.2rem;line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
h2{margin:0 0 6px;font-size:1.3rem}
p{margin:6px 0}
.bar{height:10px;background:rgba(128,128,128,.25);border-radius:999px;overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;background:var(--cor);transition:width .3s}
.btn{font:inherit;font-weight:800;color:#1d2a4a;background:var(--yel);border:3px solid var(--line);border-radius:14px;padding:11px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--cor);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.opt.ok{background:var(--mint);color:#10301f}
.opt.no{background:var(--cor);color:#2a0a05}
.q{font-weight:800;font-size:1.15rem;margin:8px 0}
.fb{min-height:3em;font-weight:600;margin:8px 0}
.strand{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.b{width:38px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;border:2px solid var(--line);border-radius:10px;background:var(--sky);color:#10243f}
.b.r{background:var(--card);color:var(--ink);border-style:dashed}
.b.r.f{background:var(--mint);color:#10301f;border-style:solid}
.b.r.x{background:var(--cor);color:#2a0a05;border-style:solid}
.ends{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pad .btn{padding:14px 0;font-size:1.3rem}
.big{font-size:2.6rem;font-weight:800;margin:0}
.tbar{height:12px;background:rgba(128,128,128,.25);border-radius:999px;overflow:hidden;border:2px solid var(--line)}
.tbar i{display:block;height:100%;width:100%;background:var(--mint)}
.tc{text-align:right;font-weight:800;font-size:.9rem;margin:2px 0 6px}
.lb{margin-top:18px}
.lb ol{list-style:none;margin:8px 0 0;padding:0}
.lb li{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:700}
.lb li.me{background:var(--yel);color:#1d2a4a}
.lb li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type="text"]{font:inherit;font-weight:800;text-align:center;width:100%;padding:10px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.pwr-bar{display:flex;gap:6px;margin:10px 0}
.pwr-btn{flex:1;padding:6px;font-size:.85rem;background:var(--bg);border:2px solid var(--line);border-radius:10px;font-weight:800;cursor:pointer;color:var(--ink)}
.pwr-btn:disabled{opacity:.4;cursor:not-allowed}
.shop-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.shop-item div{text-align:left}
.opp{background:var(--sky);color:#10243f;border:2px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:10px;font-weight:700;font-size:.9rem}
.code{font-size:2.4rem;font-weight:800;letter-spacing:.25em;text-align:center;margin:10px 0}
</style>
</head>
<body>
<main>
<div class="hud" id="hud" hidden>
  <span id="hh"></span>
  <span id="ss"></span>
  <span id="st"></span>
  <span id="cc">🪙 0</span>
</div>
<div class="opp" id="op" hidden></div>
<div class="card" id="g"></div>
</main>
<script>
// Global Firebase Realtime Database
var firebaseConfig = {
  databaseURL: "https://med-game-leaderboard-default-rtdb.firebaseio.com"
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
var db = firebase.database();

var g=document.getElementById("g"), hud=document.getElementById("hud"), OP=document.getElementById("op");
var MODE="solo", ROOM_CODE="", PH="";
var hearts,score,streak,si,qi,locked,seq,pos,pb=0,coins=0,tmr=null,tl=0,tt=1;
var playerName = "Player" + Math.floor(1000 + Math.random() * 9000);
var playerId = "usr_" + Math.random().toString(36).substr(2, 9);
var leaderboardData = [];
var duelRef = null, opponentData = null;

var items={heart:0,freeze:0,double:0};
var doubleCoinActive=false;

try{
  pb=+localStorage.getItem("ctg_pb")||0;
  coins=+localStorage.getItem("ctg_coins")||0;
  items=JSON.parse(localStorage.getItem("ctg_items"))||{heart:0,freeze:0,double:0};
  var savedName = localStorage.getItem("ctg_name");
  if(savedName) playerName = savedName;
  var savedId = localStorage.getItem("ctg_id");
  if(savedId) playerId = savedId; else localStorage.setItem("ctg_id", playerId);
}catch(e){}

function saveState(){
  try{
    localStorage.setItem("ctg_pb",pb);
    localStorage.setItem("ctg_coins",coins);
    localStorage.setItem("ctg_items",JSON.stringify(items));
    localStorage.setItem("ctg_name",playerName);
  }catch(e){}
}

// Fetch Global Leaderboard
db.ref("leaderboard").orderByChild("best").limitToLast(50).on("value", function(snapshot) {
  var list = [];
  snapshot.forEach(function(child) { list.push(child.val()); });
  list.sort(function(a,b){ return b.best - a.best; });
  leaderboardData = list;
  drawLB();
});

function submitScoreToGlobal(finalScore){
  if(finalScore <= 0) return;
  db.ref("leaderboard/" + playerId).transaction(function(current) {
    if(!current || finalScore > (current.best || 0)){
      return { id: playerId, name: playerName, best: finalScore, t: Date.now() };
    }
    return current;
  });
}

var COMP={A:"U",T:"A",G:"C",C:"G"};
var S=[
{n:"Stage 1: The Photocopier",d:"Copy the DNA template into mRNA. Tap the matching RNA base for each letter (A→U, T→A, G→C, C→G). RNA has no T!",t:"build",rounds:3},
{n:"Stage 2: Who Makes What?",d:"Three polymerases, three jobs. Pick the right one.",t:"mc",q:[
["Makes mRNA in eukaryotes",["Pol I","Pol II","Pol III"],1,"Pol II = mRNA, and it recognizes promoters."],
["Makes tRNA",["Pol III","Pol II","Pol I"],0,"Pol III = tRNA + 5S rRNA + small RNAs."],
["Makes the 28S, 18S and 5.8S rRNAs",["Pol III","Pol I","Pol II"],1,"Pol I = large rRNAs."],
["Makes 5S rRNA",["Pol I","Pol II","Pol III"],2,"5S rRNA is the odd one out: Pol III."]]},
{n:"Stage 3: Bacteria Blitz",d:"Prokaryote transcription. Quick, who does the job?",t:"mc",q:[
["Finds the promoter",["β′","σ (sigma)","ω"],1,"Sigma = the GPS."],
["Catalytic subunit that builds RNA 5′→3′",["β","α","σ"],0,"β is the builder."],
["Grips the DNA template",["β′","α","ρ"],0,"β′ binds the DNA template."],
["The −10 box sequence is called...",["Hogness box","Pribnow box","CAAT box"],1,"Pribnow (TATAAT). Hogness is the eukaryotic TATA box."],
["Needs a GC-rich hairpin to stop transcription",["ρ-dependent","Intrinsic (ρ-independent)","Rifampin"],1,"Palindrome DNA → hairpin RNA → polymerase stalls."],
["Uses ATP to pull RNA and polymerase off DNA",["Rho factor","Sigma factor","TFIID"],0,"Rho = the referee."]]},
{n:"Stage 4: Eukaryote Maze",d:"Initiation in eukaryotes and the RNA makeover.",t:"mc",q:[
["First factor to bind the TATA box",["TFIIH","TFIID","TFIIB"],1,"TFIID lands first, then the PIC assembles."],
["The helicase that unwinds DNA in the PIC",["TFIIH","TFIID","Rho"],0,"TFIIH = helicase."],
["7-methylguanosine cap belongs to...",["tRNA","mRNA","rRNA"],1,"The 5′ cap + poly-A tail = mRNA."],
["CCA is added to the 3′ end of...",["mRNA","rRNA","tRNA"],2,"CCA addition = tRNA makeover."],
["45S precursor is cut into 18S, 5.8S, 28S",["rRNA","mRNA","tRNA"],0,"45S → rRNAs, then ribosome assembly."],
["Alternative splicing gives you...",["More introns","Many proteins from one gene","A longer poly-A tail"],1,"Different exon combos = protein diversity."]]},
{n:"Boss: Dr. Inhibitor",d:"The boss attacks with antibiotics. Answer fast, no mistakes!",t:"mc",q:[
["Treats TB by binding β of bacterial RNAP",["Rifampin","Actinomycin D","Penicillin"],0,"Rifampin blocks incoming nucleotides at initiation."],
["Binds tightly to the DNA template and blocks polymerase movement",["Rifampin","Actinomycin D","Rifampin + σ"],1,"Actinomycin D stops elongation."],
["Which one also works in eukaryotes?",["Rifampin","Actinomycin D","Neither"],1,"Actinomycin D hits both, Rifampin is bacterial only."],
["Enhancers bind...",["Activator proteins (TFs, steroid hormones)","Rho factor","Spliceosomes"],0,"Enhancers can sit upstream OR downstream and boost transcription."]]}
];
S[1].sec=10;S[2].sec=9;S[3].sec=9;S[4].sec=6;

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function stopT(){clearInterval(tmr);tmr=null}
function startT(sec,end){stopT();tt=sec;tl=sec;tmr=setInterval(function(){tl-=.1;var b=document.getElementById("tb"),c=document.getElementById("tc");
 if(b){b.style.width=Math.max(0,tl/tt*100)+"%";b.style.background=tl/tt<.3?"var(--cor)":"var(--mint)"}
 if(c)c.textContent="⏱ "+Math.max(0,Math.ceil(tl))+"s";
 if(tl<=0){stopT();end()}},100)}
function tbar(){return '<div class="tbar"><i id="tb"></i></div><div class="tc" id="tc"></div>'}

function addCoins(amount){
  var mult = doubleCoinActive ? 2 : 1;
  coins += (amount * mult);
  saveState();
}

function hudUp(){
  hud.hidden=false;
  document.getElementById("hh").textContent="❤️".repeat(Math.max(hearts,0))+"🖤".repeat(3-Math.max(hearts,0));
  document.getElementById("ss").textContent="⭐ "+score;
  document.getElementById("st").textContent="🔥 "+streak;
  document.getElementById("cc").textContent="🪙 "+coins;
  if(MODE==="duel" && duelRef){
    duelRef.child("players/" + playerId).update({ score: score, hearts: Math.max(hearts,0), stage: si, name: playerName });
  }
}

function powerBar(){
  if(MODE==="duel") return '';
  return '<div class="pwr-bar">'+
    '<button class="pwr-btn" onclick="usePwr(\'heart\')" '+(items.heart<=0||hearts>=3?'disabled':'')+'>❤️ +1 ('+items.heart+')</button>'+
    '<button class="pwr-btn" onclick="usePwr(\'freeze\')" '+(items.freeze<=0?'disabled':'')+'>⏱️ +5s ('+items.freeze+')</button>'+
    '<button class="pwr-btn" onclick="usePwr(\'double\')" '+(items.double<=0||doubleCoinActive?'disabled':'')+'>🪙 2x ('+(doubleCoinActive?'ON':items.double)+')</button>'+
  '</div>';
}

function usePwr(type){
  if(type==='heart' && items.heart>0 && hearts<3){ items.heart--; hearts++; }
  else if(type==='freeze' && items.freeze>0){ items.freeze--; tl+=5; tt+=5; }
  else if(type==='double' && items.double>0 && !doubleCoinActive){ items.double--; doubleCoinActive=true; }
  saveState();hudUp();
  var el = document.getElementById("pwr-container");
  if(el) el.innerHTML = powerBar();
}

function drawLB(){
  var el=document.getElementById("lb");if(!el)return;
  var h='<p><b>Your Name:</b> '+esc(playerName)+' <button class="btn" style="padding:2px 8px;font-size:.8rem" onclick="changeName()">Edit</button></p>';
  h+='<p><b>Your Best: '+pb+' pts | 🪙 Balance: '+coins+'</b></p>';
  h+='<h2>🏆 Global Leaderboard ('+leaderboardData.length+')</h2>';
  if(!leaderboardData.length) h+='<p>No global high scores yet. Be the first!</p>';
  else{
    h+='<ol>';
    leaderboardData.forEach(function(r,i){
      var medal = ["🥇","🥈","🥉"][i] || (i+1)+".";
      var isMe = r.id === playerId;
      h+='<li class="'+(isMe?"me":"")+'"><span>'+medal+' '+esc(r.name)+(isMe?' (You)':'')+'</span><span>'+r.best+' pts</span></li>';
    });
    h+='</ol>';
  }
  el.innerHTML=h;
}

function changeName(){
  var newName = prompt("Enter your player name for the global leaderboard:", playerName);
  if(newName && newName.trim()){
    playerName = newName.trim().substring(0, 18);
    saveState();
    if(pb > 0) submitScoreToGlobal(pb);
    drawLB();
  }
}

function title(){
 stopT();hud.hidden=true;OP.hidden=true;MODE="solo";doubleCoinActive=false;
 if(duelRef) { duelRef.off(); duelRef=null; }
 g.className="card hero";
 g.innerHTML='<h1>Copy the Gene ⏱</h1><p>Race against the clock to copy DNA into RNA and conquer transcription biology!</p>'+
 '<div class="row">'+
 '<button class="btn" id="go">Play Game</button>'+
 '<button class="btn" id="shp" style="background:var(--mint)">🛍️ Shop</button>'+
 '<button class="btn" id="dl">⚔️ 1v1 Duel</button>'+
 '</div><div class="lb" id="lb"></div>';
 document.getElementById("go").onclick=function(){hearts=3;score=0;streak=0;si=0;intro()};
 document.getElementById("shp").onclick=openShop;
 document.getElementById("dl").onclick=duelMenu;
 drawLB();
}

function openShop(){
  stopT();hud.hidden=true;OP.hidden=true;
  g.className="card";
  g.innerHTML='<h2>🛍️ Game Shop</h2><p>Balance: <b>🪙 '+coins+' coins</b></p>'+
  '<div class="shop-item"><div><b>❤️ Extra Heart</b><br><small>Restores 1 heart mid-game</small></div><button class="btn" onclick="buyItem(\'heart\', 50)">50 🪙</button></div>'+
  '<div class="shop-item"><div><b>⏱️ Freeze Time</b><br><small>Adds +5 seconds to timer</small></div><button class="btn" onclick="buyItem(\'freeze\', 30)">30 🪙</button></div>'+
  '<div class="shop-item"><div><b>🪙 Double Coins</b><br><small>2x coin earnings for 1 stage</small></div><button class="btn" onclick="buyItem(\'double\', 40)">40 🪙</button></div>'+
  '<div class="fb" id="sfb"></div>'+
  '<button class="opt" id="bk">Back to Menu</button>';
  document.getElementById("bk").onclick=title;
}

function buyItem(type, cost){
  var sfb=document.getElementById("sfb");
  if(coins >= cost){
    coins -= cost;
    items[type]=(items[type]||0)+1;
    saveState();
    sfb.textContent="✅ Purchased successfully!";
    openShop();
  } else {
    sfb.textContent="❌ Not enough coins!";
  }
}

/* 1v1 DUEL SYSTEM VIA FIREBASE */
function duelMenu(){
  stopT();hud.hidden=true;OP.hidden=true;g.className="card";
  g.innerHTML='<h2>1v1 Duel ⚔️</h2><p>Play identical questions live against a friend!</p>'+
  '<button class="btn" id="mk">Create Room Code</button>'+
  '<p>Or enter a friend\'s 4-letter room code:</p>'+
  '<div><input type="text" id="cd" maxlength="4" placeholder="CODE"><button class="btn" id="jn">Join Duel</button></div>'+
  '<div class="fb" id="er"></div><button class="opt" id="bk">Back</button>';
  document.getElementById("bk").onclick=title;
  document.getElementById("mk").onclick=function(){
    var c=""; var a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    for(var i=0;i<4;i++) c+=a[Math.floor(Math.random()*a.length)];
    joinDuelRoom(c);
  };
  document.getElementById("jn").onclick=function(){
    var c=document.getElementById("cd").value.trim().toUpperCase();
    if(c.length!==4){ document.getElementById("er").textContent="Enter a 4-character room code."; return; }
    joinDuelRoom(c);
  };
}

function joinDuelRoom(code){
  ROOM_CODE = code; MODE = "duel"; PH = "lobby";
  duelRef = db.ref("duels/" + code);
  duelRef.child("players/" + playerId).set({ name: playerName, ready: false, score: 0, hearts: 3, stage: 0, done: false });
  duelRef.child("players/" + playerId).onDisconnect().remove();
  
  duelRef.on("value", function(snap){
    var val = snap.val();
    if(!val || !val.players) return;
    var players = val.players;
    var keys = Object.keys(players);
    var oppKey = keys.find(k => k !== playerId);
    opponentData = oppKey ? players[oppKey] : null;

    if(PH === "lobby") drawDuelLobby();
    else if(PH === "play") updateOpponentHUD();
    else if(PH === "end") drawDuelEnd();

    if(PH === "lobby" && keys.length === 2 && players[playerId].ready && opponentData && opponentData.ready){
      PH = "play"; hearts = 3; score = 0; streak = 0; si = 0; OP.hidden = false;
      updateOpponentHUD(); intro();
    }
  });
  drawDuelLobby();
}

function drawDuelLobby(){
  g.className = "card";
  var isReady = false;
  db.ref("duels/" + ROOM_CODE + "/players/" + playerId + "/ready").once("value", s => isReady = s.val());
  
  g.innerHTML = '<h2>Duel Lobby</h2><p>Share this code with your opponent:</p><div class="code">'+esc(ROOM_CODE)+'</div>'+
  '<p>'+(opponentData ? '⚔️ <b>'+esc(opponentData.name)+'</b> is here ' + (opponentData.ready ? 'and ready!' : '(waiting...)') : 'Waiting for opponent to join...')+'</p>'+
  '<button class="btn" id="rd" '+(opponentData ? '' : 'disabled')+'>' + (isReady ? 'Ready! Waiting for start...' : 'I\'m Ready') + '</button> '+
  '<button class="opt" id="bk">Leave</button>';
  
  document.getElementById("bk").onclick = title;
  document.getElementById("rd").onclick = function(){
    duelRef.child("players/" + playerId + "/ready").set(true);
  };
}

function updateOpponentHUD(){
  if(!opponentData) { OP.textContent = "⚔️ Opponent disconnected"; return; }
  OP.textContent = "⚔️ " + esc(opponentData.name) + ": ⭐ " + (opponentData.score||0) + "  ❤️ " + (opponentData.hearts??3) + "  Stage " + ((opponentData.stage||0)+1) + (opponentData.done ? " ✔" : "");
}

function intro(){
 hudUp();var s=S[si];g.className="card";
 doubleCoinActive=false;
 g.innerHTML='<h2>'+s.n+'</h2><p>'+s.d+'</p><p><b>'+(s.t==="build"?"Time depends on strand length.":s.sec+" seconds per question.")+'</b></p><button class="btn" id="go">Go</button>';
 document.getElementById("go").onclick=function(){qi=0;if(s.t==="build")newRound();else{s.o=shuf(s.q.slice());showQ()}};
}

function ok(){
  streak++;
  var p=10+Math.min(streak,5)*2+Math.round(Math.max(tl,0)/tt*8);
  score+=p;
  addCoins(5);
  return p;
}

function bad(){streak=0;hearts--;hudUp();if(hearts<=0){setTimeout(over,1200);return true}return false}
function bar(n,t){return '<div class="bar"><i style="width:'+(n/t*100)+'%"></i></div>'}

function showQ(){
 var s=S[si],q=s.o[qi];locked=false;hudUp();
 var h=bar(qi,s.o.length)+'<div id="pwr-container">'+powerBar()+'</div>'+tbar()+'<div class="q">'+q[0]+'</div>';
 shuf([0,1,2]).forEach(function(k){h+='<button class="opt" data-k="'+k+'">'+q[1][k]+'</button>'});
 g.innerHTML=h+'<div class="fb" aria-live="polite"></div>';
 g.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.k,b)}});
 startT(s.sec,function(){pick(-1)});
}

function pick(k,b){
 if(locked)return;locked=true;stopT();var s=S[si],q=s.o[qi],fb=g.querySelector(".fb"),dead=false;
 g.querySelectorAll(".opt").forEach(function(x){if(+x.dataset.k===q[2])x.classList.add("ok")});
 if(k===q[2]){var p=ok();fb.textContent="✅ +"+p+" pts (+"+(doubleCoinActive?10:5)+" 🪙). "+q[3]}
 else{if(b)b.classList.add("no");fb.textContent=(k<0?"⏰ Time's up! ":"❌ ")+q[3];dead=bad()}
 hudUp();if(dead)return;
 setTimeout(function(){qi++;if(qi>=s.o.length)stageDone();else showQ()},1500);
}

function newRound(){
 var L=5+qi,a="ACGT";seq=[];for(var i=0;i<L;i++)seq.push(a[Math.floor(Math.random()*4)]);pos=0;locked=false;drawBuild();
 startT(4+L*1.6,function(){buildTimeout()});
}

function drawBuild(msg){
 var s=S[si],h=bar(qi,s.rounds)+'<div id="pwr-container">'+powerBar()+'</div>'+tbar()+'<div class="q">Round '+(qi+1)+': build the mRNA</div><div class="ends"><span>DNA template 3′</span><span>5′</span></div><div class="strand">';
 seq.forEach(function(c){h+='<div class="b">'+(c==="U"?"T":c)+'</div>'});
 h+='</div><div class="ends"><span>mRNA 5′</span><span>3′</span></div><div class="strand" id="rs">';
 seq.forEach(function(c,i){h+='<div class="b r'+(i<pos?" f":"")+'">'+(i<pos?COMP[c]:"")+'</div>'});
 h+='</div><div class="fb" aria-live="polite">'+(msg||"Tap the base that pairs with the next DNA letter.")+'</div><div class="pad">';
 ["A","U","G","C"].forEach(function(c){h+='<button class="btn" data-c="'+c+'">'+c+'</button>'});
 g.innerHTML=h+'</div>';
 g.querySelectorAll(".pad .btn").forEach(function(b){b.onclick=function(){tap(b.dataset.c)}});
}

function nextRound(){qi++;if(qi>=S[si].rounds)stageDone();else newRound()}
function buildTimeout(){
 if(locked)return;locked=true;var dead=bad();drawBuild("⏰ Time's up! Too slow.");if(!dead)setTimeout(nextRound,1200);
}

function tap(c){
 if(locked)return;
 if(c===COMP[seq[pos]]){ok();pos++;hudUp();
  if(pos>=seq.length){
    locked=true;stopT();
    var bonus=Math.round(tl*2);
    score+=bonus;
    addCoins(10);
    hudUp();
    drawBuild("🎉 Copy complete! Bonus +"+bonus+" pts (+"+(doubleCoinActive?20:10)+" 🪙)");
    setTimeout(nextRound,1200)
  }
  else drawBuild("Nice! Keep going.");
 }else{
  var dead=bad();drawBuild("❌ "+seq[pos]+" pairs with "+COMP[seq[pos]]+" (A→U, T→A, G→C, C→G).");
  var cells=document.querySelectorAll("#rs .b");if(cells[pos])cells[pos].classList.add("x");
  if(dead){locked=true;stopT()}
 }
}

function stageDone(){
 stopT();si++;addCoins(25);saveState();
 if(si>=S.length)return win();
 g.innerHTML='<h2>Stage clear! ✨</h2><p>Score: '+score+'. Hearts left: '+hearts+'.</p><p>Stage Reward: <b>+'+(doubleCoinActive?50:25)+' Coins 🪙</b></p><button class="btn" id="go">Next stage</button>';
 document.getElementById("go").onclick=intro;
}

function win(){
 var bonus=hearts*20;score+=bonus;addCoins(50);
 var isNewBest = score > pb;
 if(isNewBest){ pb = score; saveState(); }
 submitScoreToGlobal(score);
 hudUp();
 if(MODE==="duel"){
   PH="end";
   duelRef.child("players/" + playerId).update({ done: true, score: score });
   drawDuelEnd();
   return;
 }
 var r=hearts===3?"Transcription Legend 🏆":hearts===2?"RNAP Pro 🥇":"Survivor 🥈";
 g.innerHTML='<p class="big">'+score+'</p><h2>'+r+'</h2><p>Boss defeated! Bonus +'+bonus+' pts & +50 🪙 for completion.'+(isNewBest?' <b>New Personal Best! 🎉</b>':'')+'</p><button class="btn" id="go">Play Again</button><div class="lb" id="lb"></div>';
 document.getElementById("go").onclick=title;drawLB();
}

function over(){
 stopT();
 var isNewBest = score > pb;
 if(isNewBest){ pb = score; saveState(); }
 submitScoreToGlobal(score);
 if(MODE==="duel"){
   PH="end";
   duelRef.child("players/" + playerId).update({ done: true, score: score });
   drawDuelEnd();
   return;
 }
 g.innerHTML='<h2>Game over 💔</h2><p>You fell off the DNA at stage '+(si+1)+'. Score: '+score+(isNewBest?'. <b>New Personal Best!</b>':'.')+'</p><button class="btn" id="go">Try Again</button><div class="lb" id="lb"></div>';
 document.getElementById("go").onclick=title;drawLB();
}

function drawDuelEnd(){
  var h='<p class="big">'+score+'</p>';
  if(!opponentData) h+='<h2>Opponent left 🏳️</h2><p>You win by forfeit!</p>';
  else if(!opponentData.done) h+='<h2>Finished!</h2><p>Waiting for '+esc(opponentData.name)+' to complete their run... (Current: '+opponentData.score+' pts)</p>';
  else {
    var oppScore = opponentData.score || 0;
    if(score > oppScore) h+='<h2>You Win! 🏆</h2>';
    else if(score < oppScore) h+='<h2>You Lost 💔</h2>';
    else h+='<h2>Draw! 🤝</h2>';
    h+='<p>Your Score: '+score+' vs '+esc(opponentData.name)+': '+oppScore+'</p>';
  }
  g.innerHTML=h+'<button class="btn" id="go">Main Menu</button>';
  document.getElementById("go").onclick=title;
}

title();
</script>
</body>
</html>
